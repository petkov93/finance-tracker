# Deploy: Render Dashboard → New → Blueprint → connect this repo.
# Required secrets in the dashboard (not in this file):
#   SUPABASE_URL, SECRET_KEY, ALLOWED_HOSTS, CSRF_TRUSTED_ORIGINS

services:
  - type: web
    name: finance-tracker
    runtime: python
    plan: free
    healthCheckPath: /health/
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py seed_categories && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: DJANGO_DEBUG
        value: "false"
      - key: WEB_CONCURRENCY
        value: "2"
